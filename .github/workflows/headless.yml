name: Headless H1/H2
on:
  push:
    branches: [main, h1-headless, h2-core]
  pull_request:
    branches: [main, h1-headless, h2-core]
jobs:
  macos-desktop-control:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS desktop control server
        run: swift build -c release --product BluePixel
      - name: Control the displayed machine through Unix and WebSocket
        run: BLUEPIXEL_DESKTOP_BINARY="$PWD/.build/release/BluePixel" python3 Tests/headless/test_server.py

  wasm-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build native CPCApi host
        run: tools/build-headless.sh
      - name: Browser-compatible WebSocket client
        run: node Tests/wasm/test_control_websocket.mjs
      - name: Prepare disposable ROMs
        run: python3 Tests/headless/make_test_roms.py "$RUNNER_TEMP/bluepixel-test-roms"
      - name: Build CPCApi WebAssembly
        run: tools/build-wasm-capi.sh
      - name: Compare native and WebAssembly machines
        env:
          BLUEPIXEL_ROM_DIR: ${{ runner.temp }}/bluepixel-test-roms
        run: node Tests/wasm/conformance.mjs --wasm web/bluepixel-capi.js
      - name: Exercise the browser adapter with the nave fixture
        run: node Tests/wasm/test_web_client.mjs
      - name: Compare native and WebAssembly with the pinned fixture ROMs
        env:
          BLUEPIXEL_ROM_DIR: ${{ github.workspace }}/web/roms
        run: node Tests/wasm/conformance.mjs --wasm web/bluepixel-capi.js

  linux-x86_64-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static zlib and gdb (state coverage reads the debug info)
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev gdb
      - name: Build static Linux executable
        run: LDFLAGS=-static tools/build-headless.sh
      - name: Check executable version
        run: ./build/bluepixel-headless --version
      - name: Prepare disposable ROMs for API smoke
        run: |
          python3 Tests/headless/make_test_roms.py "$RUNNER_TEMP/bluepixel-test-roms"
          echo "BLUEPIXEL_ROM_DIR=$RUNNER_TEMP/bluepixel-test-roms" >> "$GITHUB_ENV"
      - name: Run headless API smoke on Linux
        run: LDFLAGS=-static python3 Tests/headless/test_api.py
      - name: Headless API 1.3 (input, display, audio, tape, discs, debugger, schema contract)
        run: LDFLAGS=-static python3 Tests/headless/test_api_ext.py   # rebuilds build/bluepixel-headless: keep it static for the last step
      - name: Headless API 1.3 under ASan/UBSan (memory errors and leaks)
        run: BLUEPIXEL_SANITIZE=1 python3 Tests/headless/test_api_ext.py
      - name: Authenticated Unix and WebSocket control transports
        run: BLUEPIXEL_NO_BUILD=1 python3 Tests/headless/test_server.py
      - name: Control transports under ASan/UBSan
        run: |
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="" tools/build-headless.sh build/bluepixel-server-asan
          BLUEPIXEL_NO_BUILD=1 BLUEPIXEL_HEADLESS_BINARY="$PWD/build/bluepixel-server-asan" python3 Tests/headless/test_server.py
      - name: Native vs native conformance harness self-test
        run: node Tests/wasm/conformance.mjs --self-test
      - name: Canonical state covers every field (debug-info probe, restore fuzz under ASan/UBSan)
        run: python3 Tests/headless/check_state_coverage.py
      - name: Canonical state is independent of struct layout (default vs packed build, handoff both ways)
        run: python3 Tests/headless/test_state_abi.py
      - name: Exercise the VPS measurement tool and real-ROM acceptance
        env:
          BLUEPIXEL_ROM_DIR: ${{ github.workspace }}/web/roms
        run: python3 tools/measure-headless.py --output "$RUNNER_TEMP/bluepixel-measure"
      - name: Save reproducible measurements
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless-measurements
          path: |
            ${{ runner.temp }}/bluepixel-measure/*.json
            ${{ runner.temp }}/bluepixel-measure/*.log
      - name: Verify static Linux executable
        run: |
          file build/bluepixel-headless
          output="$(ldd build/bluepixel-headless 2>&1 || true)"
          case "$output" in *"not a dynamic executable"*) ;; *) echo "$output"; exit 1 ;; esac
